[project]
name = "mcp-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastmcp>=4.1.0",
    "prefab-ui>=0.20.2",
    "pydantic-settings>=2.16.0",
    "ruff>=0.17.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlglot>=30.23.0",
]

[project.scripts]
mcp-sql = "mcp_sql.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sql"]
